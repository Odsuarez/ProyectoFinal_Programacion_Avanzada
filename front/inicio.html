<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante | Inicio</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <script src="/js/inicio.js" defer></script>
</head>
<body>
    <main class="tarjeta panel panel-inicio">
        <p class="marca">RESTAURANTE XYZ</p>
        <h1>Bienvenido</h1>
        <p id="estado-sesion" class="descripcion" role="status">Comprobando tu sesión...</p>
        <section id="datos-sesion" hidden>
            <header class="cabecera-inicio">
                <div>
                    <h2 id="nombre-usuario"></h2>
                    <p id="rol-usuario" class="descripcion"></p>
                </div>
                <button id="cerrar-sesion" class="boton-secundario" type="button">Cerrar sesión</button>
            </header>
            <section class="seccion-mesas" aria-labelledby="titulo-mesas">
                <div class="cabecera-mesas">
                    <div>
                        <p class="etiqueta">SALÓN DEL RESTAURANTE</p>
                        <h2 id="titulo-mesas">Mesas</h2>
                    </div>
                    <button id="actualizar-mesas" class="boton-secundario" type="button">Actualizar mesas</button>
                </div>
                <div class="filtros-mesas">
                    <label for="filtro-estado">Filtrar por estado</label>
                    <select id="filtro-estado" disabled>
                        <option value="">Todas las mesas</option>
                        <option value="disponible">Disponibles</option>
                        <option value="reservada">Reservadas</option>
                        <option value="ocupada">Ocupadas</option>
                        <option value="fuera_servicio">Fuera de servicio</option>
                    </select>
                </div>
                <p id="mensaje-mesas" class="descripcion" role="status" aria-live="polite"></p>
                <div id="lista-mesas" class="lista-mesas"></div>
            </section>
        </section>
        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        <a id="volver-login" href="/" hidden>Volver al login</a>
    </main>
</body>
</html>
